version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - export NEXT_TELEMETRY_DISABLED=1
            - npm ci --prefix ../.. --no-audit --no-fund
        build:
          commands:
            - npm run build:shared --prefix ../..
            - npm run build:web --prefix ../..
      artifacts:
        baseDirectory: out
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/**/*
          - .next/cache/**/*
